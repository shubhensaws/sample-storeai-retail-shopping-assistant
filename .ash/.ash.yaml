    # ==== Terraform: infra/terraform/modules/data-plane/main.tf (DynamoDB + S3 + SSM) ====
    - rule_id: 'CKV_AWS_119'
      path: 'infra/terraform/modules/data-plane/main.tf'
      reason: 'DynamoDB uses AWS-owned encryption at rest; a customer-managed KMS CMK adds cost + key management with no benefit for a single-tenant demo. Deferred (docs/known-limitations.md).'
    - rule_id: 'CKV_AWS_28'
      path: 'infra/terraform/modules/data-plane/main.tf'
      reason: 'DynamoDB PITR (continuous backups) is a cost tradeoff; demo data is seeded/ephemeral (PITR is enabled where it matters — customers, orders).'
    - rule_id: 'CKV2_AWS_34'
      path: 'infra/terraform/modules/data-plane/main.tf'
      reason: 'These SSM parameters hold non-secret resource names (bucket/table names); SecureString would force KMS-decrypt permissions on every reader for no security benefit.'
    - rule_id: 'CKV_AWS_145'
      path: 'infra/terraform/modules/data-plane/main.tf'
      reason: 'S3 buckets use AES256 (SSE-S3); SSE-KMS with a CMK adds cost + key management with no benefit for a demo.'
    - rule_id: 'CKV_AWS_18'
      path: 'infra/terraform/modules/data-plane/main.tf'
      reason: 'S3 server access logging requires a dedicated log bucket + storage cost; deferred for the demo (docs/known-limitations.md).'
    - rule_id: 'CKV_AWS_21'
      path: 'infra/terraform/modules/data-plane/main.tf'
      reason: 'Buckets are ephemeral (force_destroy + lifecycle expiry); versioning is counterproductive and adds storage cost.'
    - rule_id: 'CKV_AWS_144'
      path: 'infra/terraform/modules/data-plane/main.tf'
      reason: 'Cross-region replication is expensive/complex and unnecessary for a single-region demo.'
    - rule_id: 'CKV2_AWS_62'
      path: 'infra/terraform/modules/data-plane/main.tf'
      reason: 'No S3 event-notification use case in this demo.'


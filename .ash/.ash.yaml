# ASH (Automated Security Helper) configuration.
#
# global_settings.suppressions: reviewed, accepted findings. ASH applies these itself
# (post-processing match on rule_id + path), so they work for any scanner (e.g. Checkov).
# Suppressed findings remain VISIBLE in the report (marked suppressed) but are not counted
# toward failure thresholds. Field names per docs/suppressions.md: `path` (NOT file_path),
# `rule_id` (exact or fnmatch glob), `reason` (required). Paths are repo-relative.
#
# Broader context for the deferred hardening below: docs/known-limitations.md + docs/security.md
# ("review before non-demo use"). Verify matches via reports/ash.unused-suppressions.md (expect 0 unused).

global_settings:
  ignore_paths:
    # Local, git-ignored deploy config (never published). It legitimately holds a
    # demo temp password + non-secret deployment IDs; exclude it from scanning so
    # it doesn't trip the secret detector on a developer's machine. Absent on a
    # clean clone, so this is a harmless no-op there.
    - path: 'storeai.config.json'
      reason: 'Git-ignored local deploy config (demo credentials + non-secret IDs); not part of the published repo.'
  suppressions:
    # ---- k8s/llm-serving.yaml (vLLM Qwen3-8B model server; `llm` module off by default) ----
    - rule_id: 'CKV_K8S_22'
      path: 'k8s/llm-serving.yaml'
      reason: 'Read-only root filesystem breaks the vLLM JIT compile + the aws-cli hostPath /models cache sync (they must write). Demo workload.'
    - rule_id: 'CKV_K8S_23'
      path: 'k8s/llm-serving.yaml'
      reason: 'Runs as root for Neuron device access and hostPath /models writes. Deferred hardening, see docs/known-limitations.md.'
    - rule_id: 'CKV_K8S_40'
      path: 'k8s/llm-serving.yaml'
      reason: 'High-UID requirement is moot while the workload intentionally runs as root (see CKV_K8S_23).'
    - rule_id: 'CKV_K8S_21'
      path: 'k8s/llm-serving.yaml'
      reason: 'All StoreAI workloads deploy to the default namespace by design (single-tenant demo). See docs/known-limitations.md.'
    - rule_id: 'CKV2_K8S_6'
      path: 'k8s/llm-serving.yaml'
      reason: 'NetworkPolicies are intentionally omitted for the demo; documented deferred hardening in docs/known-limitations.md.'
    - rule_id: 'CKV_K8S_43'
      path: 'k8s/llm-serving.yaml'
      reason: 'vLLM image is version-tag-pinned; full digest pinning is high-maintenance for a sample. The aws-cli helper containers ARE digest-pinned.'
    - rule_id: 'CKV_K8S_8'
      path: 'k8s/llm-serving.yaml'
      reason: 'vLLM cold-starts with a 20-40 min JIT compile; a liveness probe risks killing the pod mid-compile (crash loop). The readiness probe (failureThreshold 120 = 1h) gates traffic.'
    - rule_id: 'CKV_K8S_9'
      path: 'k8s/llm-serving.yaml'
      reason: 'The vLLM container has a readiness probe; the background cache-sync sidecar is a fire-and-forget uploader that needs no probe.'
    - rule_id: 'CKV_K8S_11'
      path: 'k8s/llm-serving.yaml'
      reason: 'CPU limit intentionally omitted on the vLLM container to avoid throttling inference on its dedicated Trn2 node; CPU requests are set. aws-cli helpers have limits.'
    - rule_id: 'CKV_K8S_13'
      path: 'k8s/llm-serving.yaml'
      reason: 'Memory limit intentionally omitted on the vLLM container to avoid OOM-kill during compile on its dedicated node; memory requests are set. aws-cli helpers have limits.'
    - rule_id: 'CKV_K8S_35'
      path: 'k8s/llm-serving.yaml'
      reason: 'Optional HF_TOKEN is injected as an env var (from the hf-token secret) because the HuggingFace download tooling reads the token from the environment; it is transient (used only by the one-shot model-download init) and absent unless a token is configured.'

    # ---- k8s/bootstrap/nvidia-device-plugin.yaml (vendored upstream NVIDIA k8s-device-plugin,
    #      kube-system, system-node-critical; provides GPUs to whisper + fashn). Privileged/root/
    #      host access is inherent to a device plugin. Resources + imagePullPolicy ARE set. ----
    - rule_id: 'CKV_K8S_16'
      path: 'k8s/bootstrap/nvidia-device-plugin.yaml'
      reason: 'A device plugin must run privileged to access GPU devices and register with the kubelet. Upstream requirement.'
    - rule_id: 'CKV_K8S_20'
      path: 'k8s/bootstrap/nvidia-device-plugin.yaml'
      reason: 'allowPrivilegeEscalation is implied true under privileged: true (required); cannot be meaningfully disabled.'
    - rule_id: 'CKV_K8S_22'
      path: 'k8s/bootstrap/nvidia-device-plugin.yaml'
      reason: 'Upstream device plugin writes at runtime; read-only root filesystem is not supported by the vendored image.'
    - rule_id: 'CKV_K8S_23'
      path: 'k8s/bootstrap/nvidia-device-plugin.yaml'
      reason: 'Device plugin runs as root for host device access (/var/lib/kubelet/device-plugins).'
    - rule_id: 'CKV_K8S_40'
      path: 'k8s/bootstrap/nvidia-device-plugin.yaml'
      reason: 'Tied to runAsNonRoot; the device plugin must run as root (see CKV_K8S_23).'
    - rule_id: 'CKV_K8S_28'
      path: 'k8s/bootstrap/nvidia-device-plugin.yaml'
      reason: 'Capability controls are moot under privileged: true.'
    - rule_id: 'CKV_K8S_37'
      path: 'k8s/bootstrap/nvidia-device-plugin.yaml'
      reason: 'Capability controls are moot under privileged: true.'
    - rule_id: 'CKV_K8S_31'
      path: 'k8s/bootstrap/nvidia-device-plugin.yaml'
      reason: 'seccomp is unconfined for the privileged device plugin (host device access); not configurable without breaking it.'
    - rule_id: 'CKV_K8S_29'
      path: 'k8s/bootstrap/nvidia-device-plugin.yaml'
      reason: 'securityContext is present (privileged); the full non-privileged bundle conflicts with a device plugin.'
    - rule_id: 'CKV_K8S_38'
      path: 'k8s/bootstrap/nvidia-device-plugin.yaml'
      reason: 'Registers via the kubelet device-plugin gRPC socket; SA-token auth is not modified on this system-node-critical component.'
    - rule_id: 'CKV_K8S_8'
      path: 'k8s/bootstrap/nvidia-device-plugin.yaml'
      reason: 'gRPC system daemon (not an HTTP server); upstream device plugin ships no liveness probe.'
    - rule_id: 'CKV_K8S_9'
      path: 'k8s/bootstrap/nvidia-device-plugin.yaml'
      reason: 'gRPC system daemon; upstream device plugin ships no readiness probe.'
    - rule_id: 'CKV_K8S_43'
      path: 'k8s/bootstrap/nvidia-device-plugin.yaml'
      reason: 'Upstream image is version-tag-pinned (v0.17.1); digest pinning is high-maintenance for a vendored add-on.'
    - rule_id: 'CKV2_K8S_6'
      path: 'k8s/bootstrap/nvidia-device-plugin.yaml'
      reason: 'kube-system infra DaemonSet; NetworkPolicies intentionally omitted for the demo (docs/known-limitations.md).'


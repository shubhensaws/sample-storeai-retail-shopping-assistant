    - rule_id: 'CKV2_AWS_11'
      path: 'infra/terraform/modules/network/main.tf'
      reason: 'VPC flow logs add CloudWatch/S3 cost; deferred for the demo (recommended for production).'
    - rule_id: 'CKV_AWS_130'
      path: 'infra/terraform/modules/network/main.tf'
      reason: 'Public subnets legitimately auto-assign public IPs (NAT gateway + internet-facing ALB); workloads run in private subnets.'
    - rule_id: 'CKV_AWS_382'
      path: 'infra/terraform/modules/network/main.tf'
      reason: 'Interface-endpoint SG needs outbound; all-egress is standard for this shared SG.'

    # ==== Dockerfiles: CKV_DOCKER_3 (non-root USER) where root is required or N/A ====
    - rule_id: 'CKV_DOCKER_3'
      path: 'components/whisper/Dockerfile'
      reason: 'GPU/CUDA model server needs root for device access + the root-owned baked model at /models/hf; runs as root by design (matches the k8s securityContext).'
    - rule_id: 'CKV_DOCKER_3'
      path: 'components/vton-fashn/Dockerfile'
      reason: 'GPU/CUDA model server needs root for device access + the root-owned baked weights at /weights; runs as root by design (matches the k8s securityContext).'
    - rule_id: 'CKV_DOCKER_3'
      path: 'components/frontend/Dockerfile'
      reason: 'Optional nginx alt-image for container deployment; the default deploy serves the static export from S3+CloudFront (no running container). nginx-non-root needs writable temp/pid config changes out of scope.'

    # ==== Bandit (Python) — false-positives / by-design for this architecture ====
    # B104: containerized servers must bind 0.0.0.0 to accept pod-network traffic;
    #       access is restricted by the private ALB + security groups + app-level Cognito auth.
    - rule_id: 'B104'
      path: 'components/voice-nova/server.py'
      reason: 'Containerized server binds 0.0.0.0 by necessity; isolation via private ALB + SGs + Cognito auth.'
    - rule_id: 'B104'
      path: 'components/whisper/whisper_server.py'
      reason: 'Containerized server binds 0.0.0.0 by necessity; isolation via private ALB + SGs + Cognito auth.'
    - rule_id: 'B104'
      path: 'components/vton-fashn/server.py'
      reason: 'Containerized server binds 0.0.0.0 by necessity; isolation via private ALB + SGs + Cognito auth.'
    - rule_id: 'B104'
      path: 'vton-neuron/serve.py'
      reason: 'Containerized model server binds 0.0.0.0 by necessity; isolation via private ALB + SGs + Cognito auth.'
    # B310: urlopen targets are fixed internal/AWS endpoints or trusted catalog data, never user-controlled.
    - rule_id: 'B310'
      path: 'components/orchestrator/app/main.py'
      reason: 'urlopen targets fixed internal cluster URLs (liveavatar-svc) and the Cognito JWKS endpoint (from COGNITO_USER_POOL_ID env); not user-controlled.'
    - rule_id: 'B310'
      path: 'components/mcp/tryon-mcp/lambda_function.py'
      reason: 'urlopen fetches admin-seeded catalog product image URLs and the internal VTON model endpoint; not user-controlled.'
    - rule_id: 'B310'
      path: 'components/orchestrator/app/vton_verify.py'
      reason: 'urlopen targets a fixed internal/AWS endpoint for VTON output verification; not user-controlled.'
    - rule_id: 'B310'
      path: 'components/voice-nova/server.py'
      reason: 'urlopen fetches the Cognito JWKS (fixed AWS endpoint from env) for JWT verification; not user-controlled.'
    - rule_id: 'B310'
      path: 'components/whisper/whisper_server.py'
      reason: 'urlopen fetches the Cognito JWKS (fixed AWS endpoint from env) for JWT verification; not user-controlled.'
    - rule_id: 'B310'
      path: 'vton-neuron/serve.py'
      reason: 'urlopen targets fixed AWS/S3 endpoints for model artifact retrieval; not user-controlled.'
    # B614/B615: trusted, locally-compiled / build-time-baked model artifacts (not user input).
    - rule_id: 'B614'
      path: 'vton-neuron/run_qwen_image_edit.py'
      reason: 'torch.load reads locally-compiled trusted Neuron model artifacts baked into the image; weights_only=True is incompatible with the Neuron checkpoint format.'
    - rule_id: 'B615'
      path: 'vton-neuron/neuron_qwen_image_edit/*.py'
      reason: 'from_pretrained downloads a fixed model at build time (baked into the image); revision pinning to HF commit SHAs is maintenance overhead for a sample (recommended for production).'

    # ==== Dependency CVEs (diffusers) — not exploitable in this deployment ====
    - rule_id: 'GHSA-98h9-4798-4q5v-diffusers'
      path: 'vton-neuron/requirements.txt'
      reason: 'CVE-2026-44513 is a trust_remote_code bypass via custom_pipeline/local custom components. Not exploitable here: the VTON loads a fixed, trusted QwenImageEditPlusPipeline with locally-compiled/baked models (D-038), never untrusted custom pipelines or user-provided model sources. diffusers is pinned to 0.36.0 for QwenImageEditPlusPipeline compatibility; fixed in 0.38 (requires Qwen pipeline re-validation + a Trn2 recompile — recommended for production).'
    - rule_id: 'GHSA-7wx4-6vff-v64p-diffusers'
      path: 'vton-neuron/requirements.txt'
      reason: 'Same diffusers advisory class (code injection via untrusted pipeline/components). Not exploitable — only trusted, locally-compiled/baked models are loaded. Pinned to 0.36.0 for QwenImageEditPlusPipeline; fixed in 0.38 (bump needs a Trn2 recompile — recommended for production).'
    - rule_id: 'GHSA-j7w6-vpvq-j3gm-diffusers'
      path: 'vton-neuron/requirements.txt'
      reason: 'CVE-2026-44827: same diffusers untrusted-pipeline / custom-component code-execution class. Not exploitable — vton-neuron loads only the fixed, trusted QwenImageEditPlusPipeline with locally-compiled/baked models (D-038), never untrusted custom pipelines or user-provided model sources. Fixed in 0.38 (installable alongside the required transformers<5, but the Neuron code subclasses deep diffusers internals — attention/autoencoder/modeling_outputs — so the bump needs a Trn2 recompile + Qwen pipeline revalidation; deferred pending a Capacity Block).'

    # ==== Dependency CVEs (transformers) — not exploitable + cannot upgrade (Neuron pin <5) ====
    # transformers is pinned >=4.45,<5: neuronx_distributed.pipeline.trace needs
    # transformers.utils.fx.HFTracer, removed in 5.x (and vllm needs transformers<5). All fixes below
    # are in transformers 5.x; CVE-2025-14929 has no fix. None are exploitable — vton-neuron loads only
    # the fixed, locally-compiled/baked Qwen Image-Edit model (D-038), never attacker-controlled
    # models, configs, checkpoints, or the HuggingFace Trainer.
    - rule_id: 'GHSA-29pf-2h5f-8g72-transformers'
      path: 'vton-neuron/requirements.txt'
      reason: 'CVE-2026-4372: RCE via a malicious config.json _attn_implementation_internal injection. Not exploitable — only the trusted, baked Qwen config is loaded, never an attacker-supplied one. Fixed in 5.3.0, but transformers is pinned <5 for Neuron HFTracer + vllm compatibility (bump needs a Trn2 recompile + revalidation — recommended for production).'
    - rule_id: 'GHSA-fgcw-684q-jj6r-transformers'
      path: 'vton-neuron/requirements.txt'
      reason: 'CVE-2026-5241: RCE in the LightGlue model-loading path (introduced in transformers 5.2.0). Not applicable — LightGlue is not used and the pinned 4.x line predates the affected code; only the trusted Qwen model is loaded. Pinned <5 for Neuron/vllm.'
    - rule_id: 'CVE-2025-14929-transformers'
      path: 'vton-neuron/requirements.txt'
      reason: 'CVE-2025-14929: RCE via X-CLIP checkpoint-conversion deserialization of untrusted data. Not exploitable — X-CLIP is not used and no untrusted checkpoints are converted (inference/compile only). No upstream fix exists; transformers is pinned <5 for Neuron HFTracer + vllm.'
    - rule_id: 'GHSA-69w3-r845-3855-transformers'
      path: 'vton-neuron/requirements.txt'
      reason: 'CVE-2026-1839: RCE via unsafe torch.load in Trainer._load_rng_state checkpoint loading. Not exploitable — vton-neuron does inference/compilation and never uses the HuggingFace Trainer to load untrusted checkpoints. Fixed in 5.0.0 but pinned <5 for Neuron HFTracer + vllm.'

    # ==== Secret detector: false-positive keyword match (not a real secret) ====
    - rule_id: 'SECRET-SECRET-KEYWORD'
      path: 'components/frontend/src/context/CognitoAuthContext.tsx'
      reason: 'NEW_PASSWORD_REQUIRED is a Cognito auth-challenge-name sentinel (literal string "NEW_PASSWORD_REQUIRED"), not a credential — the detector only matched the word "PASSWORD".'

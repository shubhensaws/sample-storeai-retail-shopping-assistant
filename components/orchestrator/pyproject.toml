[project]
name = "storeai-orchestrator"
version = "0.1.0"
description = "StoreAI v2 LangGraph orchestrator for AgentCore Runtime"
requires-python = ">=3.12"
dependencies = [
    "PyJWT[crypto]>=2.8",  # Cognito JWT validation (only used when COGNITO_USER_POOL_ID set)
    "langgraph>=0.3,<1",
    "langchain-core>=0.3,<1",
    "langchain-aws>=0.2,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "boto3>=1.35,<2",
    "openai>=1.40,<2",
    "qrcode[pil]>=7.4",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120
